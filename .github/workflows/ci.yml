# Workflow d'Intégration Continue (CI) - Portail R2H & PostgreSQL
name: PostgreSQL Integration CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Utiliser Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Installer les dépendances
      run: npm ci

    - name: Valider la syntaxe et types TypeScript (Linter)
      run: npm run lint

    - name: Compiler le serveur et le client web
      run: npm run build
      env:
        NODE_ENV: production
        # Configuration des variables d'environnement de simulation pour la compilation
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/railway
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
